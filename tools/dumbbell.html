<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dumbbell Workout Generator | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 06</p><h1>Dumbbell Workout Generator</h1><p>Build a dumbbell-only session around your goal, available weights, training level, body focus, and time.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="workout-builder"><form class="calculator-card" id="dbForm"><div class="form-grid"><label>Goal<select id="goal"><option value="muscle">Build muscle</option><option value="fitness">General fitness</option><option value="weight">Fat-loss support</option><option value="tone">Tone & shape</option></select></label><label>Level<select id="level"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></label><label>Time<select id="time"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label><label>Focus<select id="focus"><option value="full">Full body</option><option value="upper">Upper body</option><option value="lower">Lower body</option></select></label><label>Heaviest dumbbell you have<input id="maxWeight" type="number" min="1" max="150" value="25"></label><label>Bench?<select id="bench"><option value="no">No</option><option value="yes">Yes</option></select></label></div><button class="btn btn-primary shimmer calculator-submit" type="submit">Generate Dumbbell Workout</button></form><section class="workout-output"><div class="workout-output-head"><div><p class="eyebrow">YOUR DUMBBELL SESSION</p><h2 id="title">Ready.</h2><p id="lead"></p></div><button class="btn btn-secondary" id="regen" type="button">↻ Regenerate</button></div><div id="list" class="exercise-stack"></div><div id="note" class="results-note"></div></section></section></main><script src="../js/main.js"></script><script>(()=>{const form=document.getElementById('dbForm'),goal=document.getElementById('goal'),level=document.getElementById('level'),time=document.getElementById('time'),focus=document.getElementById('focus'),maxWeight=document.getElementById('maxWeight'),bench=document.getElementById('bench'),list=document.getElementById('list');const saved=window.LiveFit?.safePlan?.()||{};if(saved.goal&&[...goal.options].some(o=>o.value===saved.goal))goal.value=saved.goal;if(saved.time&&[...time.options].some(o=>o.value===saved.time))time.value=saved.time;const pools={full:[['Goblet Squat','lower'],['Dumbbell Romanian Deadlift','lower'],['Dumbbell Floor Press','upper'],['One-Arm Dumbbell Row','upper'],['Dumbbell Shoulder Press','upper'],['Farmer Carry','core'],['Reverse Lunge','lower'],['Dumbbell Curl','upper']],upper:[['Dumbbell Floor Press','upper'],['One-Arm Dumbbell Row','upper'],['Dumbbell Shoulder Press','upper'],['Dumbbell Curl','upper'],['Dumbbell Triceps Extension','upper'],['Farmer Carry','core'],['Dumbbell Pullover','upper']],lower:[['Goblet Squat','lower'],['Dumbbell Romanian Deadlift','lower'],['Reverse Lunge','lower'],['Dumbbell Glute Bridge','lower'],['Standing Calf Raise','lower'],['Suitcase Carry','core'],['Dumbbell Step-Back Lunge','lower']]};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function dose(){if(goal.value==='muscle')return level.value==='beginner'?['3 sets','8–12 reps','60–90 sec']:['3–4 sets','6–12 reps','75–120 sec'];if(goal.value==='weight'||goal.value==='fitness'||goal.value==='tone')return ['3 sets','10–15 reps','45–75 sec'];return ['3 sets','8–12 reps','60 sec']}function build(){let arr=shuffle(pools[focus.value]);if(bench.value==='yes'&&(focus.value==='upper'||focus.value==='full'))arr.unshift(['Incline Dumbbell Press','upper']);else arr=arr.filter(x=>x[0]!=='Incline Dumbbell Press');const max=time.value==='15'?4:time.value==='30'?6:time.value==='45'?7:8;arr=arr.slice(0,max);const d=dose();document.getElementById('title').textContent=(focus.value==='full'?'Full Body':focus.value[0].toUpperCase()+focus.value.slice(1))+' Dumbbell Workout';document.getElementById('lead').textContent=level.value+' • '+time.value+' min • max dumbbell '+maxWeight.value+' lb'+(bench.value==='yes'?' • bench available':' • no bench required');list.innerHTML=arr.map((x,i)=>'<article class="exercise-row"><span class="exercise-order">'+String(i+1).padStart(2,'0')+'</span><div class="exercise-main"><h3>'+x[0]+'</h3><p>Choose a load that leaves about 1–3 controlled reps in reserve.</p></div><div class="exercise-dose"><b>'+d[0]+'</b><span>'+d[1]+'</span><small>Rest '+d[2]+'</small></div></article>').join('');document.getElementById('note').textContent=goal.value==='muscle'?'Progress by adding clean reps first, then increase dumbbell weight when the top of the range feels controlled.':'Keep the workout repeatable. Increase only one variable at a time when form stays solid.';saved.specialtyDumbbell={goal:goal.value,level:level.value,time:+time.value,focus:focus.value,maxWeight:+maxWeight.value,bench:bench.value,exercises:arr.map(x=>x[0])};window.LiveFit?.savePlan?.(saved)}form.addEventListener('submit',e=>{e.preventDefault();build()});document.getElementById('regen').addEventListener('click',build);build()})();</script></body></html>
