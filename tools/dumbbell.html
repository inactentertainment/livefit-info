<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dumbbell Workout Generator | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 06</p><h1>Dumbbell Workout Generator</h1><p>Build a dumbbell-only session around your goal, available weights, training level, body focus, and time.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="workout-builder"><form class="calculator-card" id="dbForm"><div class="form-grid"><label>Goal<select id="goal"><option value="muscle">Build muscle</option><option value="fitness">General fitness</option><option value="weight">Fat-loss support</option><option value="tone">Tone & shape</option></select></label><label>Level<select id="level"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></label><label>Time<select id="time"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label><label>Focus<select id="focus"><option value="full">Full body</option><option value="upper">Upper body</option><option value="lower">Lower body</option></select></label><label>Heaviest dumbbell you have<input id="maxWeight" type="number" min="1" max="150" value="25"></label><label>Bench?<select id="bench"><option value="no">No</option><option value="yes">Yes</option></select></label></div><button class="btn btn-primary shimmer calculator-submit" type="submit">Generate Dumbbell Workout</button></form><section class="workout-output"><div class="workout-output-head"><div><p class="eyebrow">YOUR DUMBBELL SESSION</p><h2 id="title">Ready.</h2><p id="lead"></p></div><button class="btn btn-secondary" id="regen" type="button">↻ Regenerate</button></div><div id="list" class="exercise-stack"></div><div id="note" class="results-note"></div></section></section></main><script src="../js/main.js"></script><script>(()=>{const ex={full:[['Goblet Squat','3 × 8–12'],['Dumbbell Romanian Deadlift','3 × 8–12'],['Dumbbell Floor Press','3 × 8–12'],['One-Arm Dumbbell Row','3 × 10/side'],['Dumbbell Shoulder Press','2–3 × 8–12'],['Farmer Carry','3 × 30–45 sec']],upper:[['Dumbbell Floor Press','3 × 8–12'],['One-Arm Dumbbell Row','3 × 10/side'],['Dumbbell Shoulder Press','3 × 8–12'],['Dumbbell Curl','2–3 × 10–15'],['Dumbbell Triceps Extension','2–3 × 10–15'],['Farmer Carry','3 × 30 sec']],lower:[['Goblet Squat','3 × 10–15'],['Dumbbell Romanian Deadlift','3 × 8–12'],['Reverse Lunge','3 × 8/side'],['Dumbbell Glute Bridge','3 × 12–15'],['Standing Calf Raise','3 × 15–20'],['Suitcase Carry','3 × 30 sec/side']]};let seed=0;function build(){const f=document.getElementById('focus').value,t=+document.getElementById('time').value,w=+document.getElementById('maxWeight').value,l=document.getElementById('level').value,g=document.getElementById('goal').value;let arr=[...ex[f]];if(t<=15)arr=arr.slice(0,4);if(t>=45)arr.push(['Dumbbell Dead Bug Pullover','2–3 × 8/side']);arr.sort(()=>Math.sin(++seed*12.9898)*43758.5453%1-.5);document.getElementById('title').textContent=(f==='full'?'Full Body':f[0].toUpperCase()+f.slice(1))+' Dumbbell Workout';document.getElementById('lead').textContent=l+' • '+t+' min • max dumbbell '+w+' lb';document.getElementById('list').innerHTML=arr.map((x,i)=>'<article class="exercise-row"><span class="exercise-order">'+String(i+1).padStart(2,'0')+'</span><div class="exercise-main"><h3>'+x[0]+'</h3><p>Use a controlled weight that leaves 1–3 good reps in reserve.</p></div><div class="exercise-dose"><b>'+x[1]+'</b><small>Rest 45–90 sec</small></div></article>').join('');document.getElementById('note').textContent=g==='muscle'?'Progress by adding reps first, then increase dumbbell weight when the top of the range feels controlled.':'Keep the pace steady and stop each set before form breaks down.';}document.getElementById('dbForm').addEventListener('submit',e=>{e.preventDefault();build()});document.getElementById('regen').addEventListener('click',build);build()})();</script></body></html>
