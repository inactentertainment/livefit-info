<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Gym Space Planner | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 09</p><h1>Home Gym Space Planner</h1><p>Enter your room dimensions and see what equipment categories realistically fit while preserving usable movement space.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="calculator-layout"><form class="calculator-card" id="spaceForm"><div class="form-grid"><label>Room length<input id="length" type="number" min="4" max="50" value="10"></label><label>Room width<input id="width" type="number" min="4" max="50" value="8"></label><label>Ceiling height<input id="height" type="number" min="6" max="20" step=".1" value="8"></label><label>Need open floor space<select id="open"><option value=".35">High</option><option value=".25" selected>Medium</option><option value=".15">Low</option></select></label></div><button class="btn btn-primary shimmer calculator-submit" type="submit">Plan My Space</button></form><aside class="results-card"><p class="eyebrow">YOUR SPACE</p><h2 id="area">—</h2><p class="result-label">square feet</p><div id="spaceList" class="space-fit-list"></div></aside></section></main><script src="../js/main.js"></script><script>(()=>{const form=document.getElementById('spaceForm'),lengthEl=document.getElementById('length'),widthEl=document.getElementById('width'),heightEl=document.getElementById('height'),openEl=document.getElementById('open'),areaEl=document.getElementById('area'),listEl=document.getElementById('spaceList');const items=[{name:'Exercise mat',l:6,w:3,h:7},{name:'Adjustable dumbbells',l:2,w:3,h:7},{name:'Foldable bench',l:5,w:2.5,h:7},{name:'Walking pad',l:5,w:2.5,h:7},{name:'Exercise bike',l:4,w:2,h:7},{name:'Rower',l:8,w:2,h:7},{name:'Treadmill',l:7,w:3,h:7},{name:'Cable tower',l:4,w:4,h:7.5},{name:'Power rack',l:6,w:6,h:8}];function fitsDims(item,L,W){return (item.l<=L&&item.w<=W)||(item.w<=L&&item.l<=W)}function run(){const L=+lengthEl.value,W=+widthEl.value,H=+heightEl.value,openPct=+openEl.value,a=L*W,usable=a*(1-openPct);areaEl.textContent=Math.round(a);listEl.innerHTML=items.map(item=>{const footprint=item.l*item.w;const fits=footprint<=usable&&item.h<=H&&fitsDims(item,L,W);let reason=fits?'Fits with your current dimensions':item.h>H?'Ceiling is too low':!fitsDims(item,L,W)?'Room side length is too short':'Too much floor area once open space is reserved';return '<div class="space-fit-item"><span>'+item.name+'</span><strong class="'+(fits?'fit-yes':'fit-no')+'">'+(fits?'Fits':'Too tight')+'</strong><small>'+item.l+' × '+item.w+' ft footprint • '+item.h+' ft clearance • '+reason+'</small></div>'}).join('')}form.addEventListener('submit',e=>{e.preventDefault();run()});run()})();</script></body></html>
