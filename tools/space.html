<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Gym Space Planner | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 09</p><h1>Home Gym Space Planner</h1><p>Enter your room dimensions and see what equipment categories realistically fit while preserving usable movement space.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="calculator-layout"><form class="calculator-card" id="spaceForm"><div class="form-grid"><label>Room length<input id="length" type="number" min="4" max="50" value="10"></label><label>Room width<input id="width" type="number" min="4" max="50" value="8"></label><label>Ceiling height<input id="height" type="number" min="6" max="20" step=".1" value="8"></label><label>Need open floor space<select id="open"><option value=".35">High</option><option value=".25" selected>Medium</option><option value=".15">Low</option></select></label></div><button class="btn btn-primary shimmer calculator-submit" type="submit">Plan My Space</button></form><aside class="results-card"><p class="eyebrow">YOUR SPACE</p><h2 id="area">—</h2><p class="result-label">square feet</p><div id="spaceList" class="space-fit-list"></div></aside></section></main><script src="../js/main.js"></script><script>(()=>{const items=[['Exercise mat',18,7],['Adjustable dumbbells',6,7],['Foldable bench',18,7],['Walking pad',15,7],['Exercise bike',12,7],['Rower',20,7],['Treadmill',30,7],['Cable tower',20,7.5],['Power rack',36,8]];function run(){const a=+length.value*+width.value,h=+height.value,usable=a*(1-+open.value);area.textContent=Math.round(a);spaceList.innerHTML=items.map(x=>{const fits=x[1]<=usable&&x[2]<=h;return '<div class="space-fit-item"><span>'+x[0]+'</span><strong class="'+(fits?'fit-yes':'fit-no')+'">'+(fits?'Fits':'Too tight')+'</strong><small>'+x[1]+' sq ft footprint • '+x[2]+' ft clearance</small></div>'}).join('')}document.getElementById('spaceForm').addEventListener('submit',e=>{e.preventDefault();run()});run()})();</script></body></html>
