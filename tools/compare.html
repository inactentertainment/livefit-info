<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment Comparison Tool | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 10</p><h1>Equipment Comparison Tool</h1><p>Compare major home-gym equipment categories on space, cost, noise, cardio value, strength value, and joint friendliness.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="calculator-card"><div class="form-grid"><label>Option A<select id="a"></select></label><label>Option B<select id="b"></select></label></div><div id="compareGrid" class="comparison-grid"></div></section></main><script src="../js/main.js"></script><script>(()=>{const aEl=document.getElementById('a'),bEl=document.getElementById('b'),grid=document.getElementById('compareGrid');const data={dumbbells:{name:'Adjustable Dumbbells',cost:3,space:5,noise:4,cardio:1,strength:5,joints:4},bands:{name:'Resistance Bands',cost:5,space:5,noise:5,cardio:2,strength:3,joints:5},bike:{name:'Exercise Bike',cost:3,space:3,noise:4,cardio:5,strength:1,joints:5},rower:{name:'Rower',cost:2,space:2,noise:3,cardio:5,strength:3,joints:4},treadmill:{name:'Treadmill',cost:2,space:1,noise:2,cardio:5,strength:1,joints:3},rack:{name:'Power Rack',cost:1,space:1,noise:2,cardio:1,strength:5,joints:3}};const keys=Object.keys(data);[aEl,bEl].forEach((s,i)=>{s.innerHTML=keys.map(k=>'<option value="'+k+'">'+data[k].name+'</option>').join('');s.value=keys[i]});function dots(n){return '<span aria-label="'+n+' out of 5">'+'●'.repeat(n)+'○'.repeat(5-n)+'</span>'}function run(){const x=data[aEl.value],y=data[bEl.value],rows=[['Cost value','cost'],['Space efficiency','space'],['Quietness','noise'],['Cardio value','cardio'],['Strength value','strength'],['Joint friendly','joints']];grid.innerHTML='<div class="compare-head"><b>'+x.name+'</b><span>VS</span><b>'+y.name+'</b></div>'+rows.map(r=>'<div class="compare-row">'+dots(x[r[1]])+'<b>'+r[0]+'</b>'+dots(y[r[1]])+'</div>').join('')}aEl.addEventListener('change',run);bEl.addEventListener('change',run);run()})();</script></body></html>
