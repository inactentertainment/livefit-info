<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interval Workout Timer | LiveFit.info</title><link rel="stylesheet" href="../css/style.css"></head><body class="assessment-page"><div class="page-swoop"></div><header class="site-header"><a class="brand page-link" href="../index.html"><span class="brand-live">LIVE FIT</span><span class="brand-info">.info</span></a><div class="personal-controls"><button class="round-control" id="themeToggle">◐</button></div></header><main class="tool-page-shell"><div class="tool-page-head"><div><p class="eyebrow">SPECIALTY TOOL 08</p><h1>Interval / Workout Timer</h1><p>Set work, rest, rounds, and preparation time for circuits, walking intervals, HIIT, mobility, or strength work.</p></div><a class="btn btn-secondary page-link" href="../index.html#specialty-tools">← Specialty Tools</a></div><section class="timer-layout"><form class="calculator-card" id="timerForm"><div class="form-grid"><label>Work seconds<input id="work" type="number" min="5" max="600" value="40"></label><label>Rest seconds<input id="rest" type="number" min="0" max="600" value="20"></label><label>Rounds<input id="rounds" type="number" min="1" max="99" value="8"></label><label>Prep seconds<input id="prep" type="number" min="0" max="60" value="10"></label></div><div class="walking-quick-row"><button type="button" class="quick-step preset" data-work="30" data-rest="30" data-rounds="10">30/30</button><button type="button" class="quick-step preset" data-work="40" data-rest="20" data-rounds="8">40/20</button><button type="button" class="quick-step preset" data-work="45" data-rest="15" data-rounds="10">45/15</button><button type="button" class="quick-step preset" data-work="60" data-rest="30" data-rounds="6">60/30</button></div></form><section class="timer-card"><span id="phase" class="timer-phase">READY</span><div id="clock" class="timer-clock">00:10</div><p id="roundText">Round 0 / 8</p><div class="timer-actions"><button class="btn btn-primary" id="start" type="button">Start</button><button class="btn btn-secondary" id="pause" type="button">Pause</button><button class="btn btn-secondary" id="reset" type="button">Reset</button></div></section></section></main><script src="../js/main.js"></script><script>(()=>{let state='idle',timer=null,phase='prep',remaining=10,round=0;const el=id=>document.getElementById(id);function cfg(){return {work:+el('work').value,rest:+el('rest').value,rounds:+el('rounds').value,prep:+el('prep').value}}function show(){const c=cfg();el('phase').textContent=phase.toUpperCase();el('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');el('roundText').textContent='Round '+round+' / '+c.rounds}function reset(){clearInterval(timer);timer=null;state='idle';round=0;phase='prep';remaining=cfg().prep;show()}function tick(){const c=cfg();if(remaining>0){remaining--;show();return}if(phase==='prep'){round=1;phase='work';remaining=c.work}else if(phase==='work'){if(c.rest>0){phase='rest';remaining=c.rest}else if(round<c.rounds){round++;phase='work';remaining=c.work}else{phase='done';remaining=0;clearInterval(timer);timer=null}}else if(phase==='rest'){if(round<c.rounds){round++;phase='work';remaining=c.work}else{phase='done';remaining=0;clearInterval(timer);timer=null}}show()}el('start').addEventListener('click',()=>{if(timer)return;if(phase==='done')reset();timer=setInterval(tick,1000);state='running'});el('pause').addEventListener('click',()=>{clearInterval(timer);timer=null;state='paused'});el('reset').addEventListener('click',reset);document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{el('work').value=b.dataset.work;el('rest').value=b.dataset.rest;el('rounds').value=b.dataset.rounds;reset()}));['work','rest','rounds','prep'].forEach(id=>el(id).addEventListener('change',reset));reset()})();</script></body></html>
